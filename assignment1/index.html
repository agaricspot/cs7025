<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portland Weather</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="clouds"> 
        <img class="clouds" src="rain-clouds-png-27.png" >
        <div id="look" class="day">
            <h1>Portland Weather</h1>
            <span>It is currently <span id="time">00:00</span> in Portland, OR</span> <br><br>

            <span> The temperature is <span id="temp"></span></span><br>
            <span>High: <span id="high"> </span> &emsp; Low: <span id="low"></span></span> <br><br>

            <span> Chance of Precipitation: <span id="precip"></span></span>
        </div>
    </div>
</body>
</html>
