<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portland Weather</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="overlay" class="clouds"> </div>
    <img id="cloud" src="rain-clouds-png-27.png" >
    <div id="look" class="day"></div>



    <div class="text">
            <h1><span id="place"></span> Weather</h1>

            <div id="buttons">
                <button data-loc="portland">Portland</button>
                <button data-loc="dublin">Dublin</button>
                <button data-loc="worcester">Worcester</button>


            </div>

            <span>It is currently <span id="time">00:00</span> in <span id="place2"></span></span> <br><br>

            <span> The temperature is <span id="temp"></span></span><br>
            <span>High: <span id="high"> </span> &emsp; Low: <span id="low"></span></span> <br><br>

            <span> Chance of Precipitation: <span id="precip"></span></span>
    </div>

</body>
</html>
