    <body>
        <label for="amount">Enter Amount</label>
        <input type="number" id="amount" value="1.00" min="0.0"/>

        <label for="scurrency"> Choose Initial Currency</label>
        <select name="currency" id="scurrency">

            <option value="cad">CAD</option>

            <option value="gbp">GBP</option>
            <option value="aud">AUD</option>
        </select>

        <label for="ecurrency"> Choose Final Currency</label>
        <select name="currency" id="ecurrency">
            <option value="usd">USD</option>
            <option value="cad">CAD</option>
            <option value="eur">EUR</option>
            <option value="gbp">GBP</option>
            <option value="aud">AUD</option>
        </select>

        <button type="button" onclick="convertFromForm()"> Convert </button> 
        <button type="button" onclick="listCurrencies()"> List Currencies </button>
        <p id="result"></p>
        <ul id="currency-list" hidden></ul>

        <script src="converter.js" >


        </script>
